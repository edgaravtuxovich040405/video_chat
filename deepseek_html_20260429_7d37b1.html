<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Video Chat | Peer-to-Peer WebRTC</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, 'Segoe UI', 'Inter', 'Roboto', sans-serif;
    }

    body {
      background: linear-gradient(145deg, #0a0f1e 0%, #0c1222 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
    }

    /* MAIN CARD */
    .chat-container {
      max-width: 1300px;
      width: 100%;
      background: rgba(18, 25, 45, 0.75);
      backdrop-filter: blur(12px);
      border-radius: 2.5rem;
      box-shadow: 0 25px 45px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.05);
      padding: 1.8rem;
      transition: all 0.2s ease;
    }

    /* VIDEO GRID */
    .video-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 1.8rem;
      justify-content: center;
      margin-bottom: 2rem;
    }

    .video-card {
      flex: 1;
      min-width: 280px;
      background: #0f1422;
      border-radius: 1.8rem;
      overflow: hidden;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: transform 0.2s ease;
    }

    .video-card:hover {
      transform: scale(1.01);
    }

    .video-label {
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      padding: 0.5rem 1rem;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: #ccd6f0;
      display: inline-block;
      border-radius: 2rem;
      margin: 0.8rem 0 0 1rem;
    }

    video {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      background: #000000;
      display: block;
      border-radius: 1.2rem;
      margin-top: 0.5rem;
      transform: scaleX(1);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.1);
    }

    /* local video mirror effect */
    #localVideo {
      transform: scaleX(-1);
    }

    /* CONTROL PANEL */
    .control-panel {
      background: rgba(10, 15, 28, 0.7);
      border-radius: 2rem;
      padding: 1.5rem;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      margin-top: 0.5rem;
    }

    .id-section {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      background: #0b1020;
      padding: 1rem 1.5rem;
      border-radius: 3rem;
      margin-bottom: 1.8rem;
    }

    .my-id {
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .id-badge {
      background: #1e2a3e;
      padding: 0.5rem 1.2rem;
      border-radius: 2rem;
      font-family: monospace;
      font-weight: 600;
      font-size: 1rem;
      color: #7ee0ff;
      word-break: break-all;
      letter-spacing: 0.5px;
    }

    .copy-btn, .action-btn, .call-btn {
      background: #2a3a5a;
      border: none;
      padding: 0.5rem 1.2rem;
      border-radius: 2rem;
      font-weight: 600;
      font-size: 0.85rem;
      color: white;
      cursor: pointer;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      backdrop-filter: blur(4px);
    }

    .copy-btn:hover, .action-btn:hover {
      background: #3e5a7c;
      transform: translateY(-2px);
    }

    .call-section {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: flex-end;
      background: #0f1528;
      padding: 1.2rem;
      border-radius: 1.8rem;
      margin-bottom: 1.5rem;
    }

    .call-input-group {
      flex: 3;
      min-width: 180px;
    }

    .call-input-group label {
      display: block;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #8e9fc3;
      margin-bottom: 0.3rem;
    }

    #remoteIdInput {
      width: 100%;
      padding: 0.8rem 1rem;
      border-radius: 2rem;
      border: 1px solid #2e3a55;
      background: #010410;
      color: white;
      font-family: monospace;
      font-size: 0.9rem;
      outline: none;
      transition: 0.2s;
    }

    #remoteIdInput:focus {
      border-color: #5f9eff;
      box-shadow: 0 0 0 2px rgba(95, 158, 255, 0.3);
    }

    .call-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }

    .call-btn {
      background: #1e6f3f;
      padding: 0.7rem 1.5rem;
    }
    .call-btn:hover {
      background: #2c8f55;
    }
    .hangup-btn {
      background: #9e3c3c;
    }
    .hangup-btn:hover {
      background: #c24b4b;
    }

    .media-buttons {
      display: flex;
      gap: 0.8rem;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 0.5rem;
    }

    .media-btn {
      background: #1e293b;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 2rem;
      color: #f0f3fa;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .media-btn.active {
      background: #3b5e7e;
      box-shadow: 0 0 8px #5faaff;
    }

    .status-msg {
      background: #00000066;
      border-radius: 2rem;
      padding: 0.7rem 1.2rem;
      margin-top: 1rem;
      text-align: center;
      font-size: 0.8rem;
      color: #cbd5ff;
      font-weight: 500;
      border-left: 4px solid #2f8eff;
    }

    button:active {
      transform: scale(0.97);
    }

    hr {
      border-color: #2a3650;
      margin: 0.5rem 0;
    }

    @media (max-width: 720px) {
      .chat-container {
        padding: 1rem;
      }
      .id-section {
        flex-direction: column;
        align-items: stretch;
      }
      .video-card {
        min-width: 240px;
      }
    }
  </style>
  <!-- PeerJS library: simplifies WebRTC signaling & peer management -->
  <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
</head>
<body>
<div class="chat-container">
  <div class="video-grid">
    <!-- Local video card -->
    <div class="video-card">
      <div class="video-label">📹 YOU (Local)</div>
      <video id="localVideo" autoplay muted playsinline></video>
    </div>
    <!-- Remote video card -->
    <div class="video-card">
      <div class="video-label">🖥️ PARTNER (Remote)</div>
      <video id="remoteVideo" autoplay playsinline></video>
    </div>
  </div>

  <div class="control-panel">
    <div class="id-section">
      <div class="my-id">
        <span style="color:#a0b5e0;">🔑 YOUR PEER ID:</span>
        <span id="myPeerId" class="id-badge">Connecting...</span>
        <button id="copyIdBtn" class="copy-btn">📋 Copy ID</button>
      </div>
      <div class="media-buttons">
        <button id="toggleMicBtn" class="media-btn active">🎤 Mic ON</button>
        <button id="toggleCamBtn" class="media-btn active">📷 Cam ON</button>
      </div>
    </div>

    <div class="call-section">
      <div class="call-input-group">
        <label>📞 ENTER REMOTE PEER ID TO CALL</label>
        <input type="text" id="remoteIdInput" placeholder="Paste partner's Peer ID here...">
      </div>
      <div class="call-actions">
        <button id="callBtn" class="call-btn">📡 START CALL</button>
        <button id="hangupBtn" class="call-btn hangup-btn">❌ END CALL</button>
      </div>
    </div>

    <div id="connectionStatus" class="status-msg">
      ⚡ Initializing camera & peer connection...
    </div>
  </div>
</div>

<script>
  // ---------- DOM elements ----------
  const localVideo = document.getElementById('localVideo');
  const remoteVideo = document.getElementById('remoteVideo');
  const myPeerIdSpan = document.getElementById('myPeerId');
  const copyIdBtn = document.getElementById('copyIdBtn');
  const remoteIdInput = document.getElementById('remoteIdInput');
  const callBtn = document.getElementById('callBtn');
  const hangupBtn = document.getElementById('hangupBtn');
  const statusDiv = document.getElementById('connectionStatus');
  const toggleMicBtn = document.getElementById('toggleMicBtn');
  const toggleCamBtn = document.getElementById('toggleCamBtn');

  // ---------- Global state ----------
  let localStream = null;          // User's camera + microphone stream
  let peer = null;                 // PeerJS instance
  let currentCall = null;          // Active media connection (call)
  let isCallActive = false;

  // ---------- Helper: update status message ----------
  function setStatus(msg, isError = false) {
    statusDiv.innerHTML = isError ? `⚠️ ${msg}` : `✨ ${msg}`;
    if (isError) {
      statusDiv.style.borderLeftColor = '#ff6b6b';
    } else {
      statusDiv.style.borderLeftColor = '#2f8eff';
    }
    console.log(`[STATUS] ${msg}`);
  }

  // ---------- Toggle Media Tracks (Mic / Camera) ----------
  function toggleMicrophone() {
    if (!localStream) {
      setStatus("No local stream available", true);
      return;
    }
    const audioTrack = localStream.getAudioTracks()[0];
    if (audioTrack) {
      const isEnabled = audioTrack.enabled;
      audioTrack.enabled = !isEnabled;
      toggleMicBtn.innerHTML = !isEnabled ? "🎤 Mic ON" : "🔇 Mic OFF";
      toggleMicBtn.classList.toggle('active', !isEnabled);
      setStatus(`Microphone ${!isEnabled ? "unmuted" : "muted"}`);
    } else {
      setStatus("No audio track found", true);
    }
  }

  function toggleCamera() {
    if (!localStream) {
      setStatus("No local stream available", true);
      return;
    }
    const videoTrack = localStream.getVideoTracks()[0];
    if (videoTrack) {
      const isEnabled = videoTrack.enabled;
      videoTrack.enabled = !isEnabled;
      toggleCamBtn.innerHTML = !isEnabled ? "📷 Cam ON" : "🚫 Cam OFF";
      toggleCamBtn.classList.toggle('active', !isEnabled);
      setStatus(`Camera ${!isEnabled ? "enabled" : "disabled"}`);
    } else {
      setStatus("No video track found", true);
    }
  }

  // ---------- Attach remote stream to video element ----------
  function attachRemoteStream(stream) {
    if (remoteVideo.srcObject !== stream) {
      remoteVideo.srcObject = stream;
    }
    setStatus("Remote stream connected — video chat is LIVE!");
  }

  // ---------- Reset remote video + clean call ----------
  function endCurrentCall() {
    if (currentCall) {
      // close the peer-to-peer connection
      currentCall.close();
      currentCall = null;
    }
    if (remoteVideo.srcObject) {
      // stop all remote tracks to release resources
      const oldStream = remoteVideo.srcObject;
      if (oldStream && oldStream.getTracks) {
        oldStream.getTracks().forEach(track => track.stop());
      }
      remoteVideo.srcObject = null;
    }
    isCallActive = false;
    setStatus("Call ended. You can start a new call.");
  }

  // ---------- Setup call event listeners (for incoming/outgoing) ----------
  function setupCallEventHandlers(call, isIncoming = false) {
    // When remote adds stream
    call.on('stream', (remoteStream) => {
      attachRemoteStream(remoteStream);
      isCallActive = true;
      setStatus("📹 Video chat established! Both parties connected.");
    });

    call.on('close', () => {
      if (currentCall === call) {
        setStatus("Call was closed by remote peer.");
        endCurrentCall();
      }
    });

    call.on('error', (err) => {
      console.error("Call error:", err);
      setStatus(`Call error: ${err.message || "connection failed"}`, true);
      if (currentCall === call) {
        endCurrentCall();
      }
    });
  }

  // ---------- Initiate call to remote peer ----------
  async function startCall(remotePeerId) {
    if (!localStream) {
      setStatus("Camera/microphone not ready. Please wait or reload.", true);
      return;
    }
    if (!peer || !peer.id) {
      setStatus("Peer connection not initialized yet.", true);
      return;
    }
    if (remotePeerId === peer.id) {
      setStatus("❌ You cannot call yourself! Enter a different Peer ID.", true);
      return;
    }
    if (isCallActive) {
      setStatus("Already in a call. Please end current call first.", true);
      return;
    }

    setStatus(`Calling ${remotePeerId} ...`);
    try {
      // create outgoing call with local stream
      const call = peer.call(remotePeerId, localStream);
      currentCall = call;
      setupCallEventHandlers(call, false);
      
      // optional: handle call failure after some time
      call.on('error', (err) => {
        console.warn("Outgoing call error:", err);
        if (currentCall === call) {
          setStatus(`Cannot reach ${remotePeerId}: ${err.message || "Peer unavailable"}`, true);
          endCurrentCall();
        }
      });
    } catch (err) {
      setStatus(`Call initiation failed: ${err.message}`, true);
      console.error(err);
    }
  }

  // ---------- Incoming call handler (auto-answer) ----------
  function onIncomingCall(call) {
    if (!localStream) {
      setStatus("Incoming call, but local media not ready. Rejecting call.", true);
      call.close();
      return;
    }
    if (isCallActive) {
      setStatus("Incoming call rejected — you're already in a call.", true);
      call.close();
      return;
    }
    setStatus(`📞 Incoming call from ${call.peer} — answering automatically...`);
    // Answer the call with our local stream
    call.answer(localStream);
    currentCall = call;
    setupCallEventHandlers(call, true);
    setStatus(`Connected with ${call.peer}`);
  }

  // ---------- Initialize local media (camera + microphone) ----------
  async function initLocalMedia() {
    try {
      setStatus("Requesting camera & microphone access...");
      const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
      localStream = stream;
      localVideo.srcObject = stream;
      setStatus("Local camera & mic ready ✓");
      
      // reset media toggle buttons state
      toggleMicBtn.innerHTML = "🎤 Mic ON";
      toggleCamBtn.innerHTML = "📷 Cam ON";
      toggleMicBtn.classList.add('active');
      toggleCamBtn.classList.add('active');
      
      // if we already have peer but stream was reinitialized? but we run initPeer after media
      // but call event might need localStream already set. good.
      return true;
    } catch (err) {
      console.error("getUserMedia error:", err);
      let errorMsg = "Could not access camera/microphone. ";
      if (err.name === 'NotAllowedError') errorMsg += "Permission denied.";
      else if (err.name === 'NotFoundError') errorMsg += "No camera or mic found.";
      else errorMsg += err.message;
      setStatus(errorMsg, true);
      return false;
    }
  }

  // ---------- PeerJS initialization (signalling + STUN) ----------
  async function initPeer() {
    // PeerJS uses cloud signaling server (0.peerjs.com) with default config.
    // Generates random ID if none provided.
    return new Promise((resolve, reject) => {
      const peerInstance = new Peer();   // auto-connect to public PeerJS Cloud
      
      peerInstance.on('open', (id) => {
        myPeerIdSpan.innerText = id;
        setStatus(`Your Peer ID: ${id}. Share this ID to receive calls.`);
        resolve(peerInstance);
      });
      
      peerInstance.on('call', (call) => {
        // incoming call
        if (localStream) {
          onIncomingCall(call);
        } else {
          setStatus("Incoming call but local stream isn't ready. Please ensure camera is on.", true);
          call.close();
        }
      });
      
      peerInstance.on('error', (err) => {
        console.error("PeerJS error:", err);
        let friendlyMsg = "Peer connection error: ";
        if (err.type === 'peer-unavailable') friendlyMsg += "Remote ID not found.";
        else if (err.type === 'disconnected') friendlyMsg += "Disconnected from signaling server.";
        else friendlyMsg += err.message;
        setStatus(friendlyMsg, true);
        if (err.type === 'peer-unavailable') {
          // clean up if we were calling
          if (currentCall) endCurrentCall();
        }
      });
      
      peerInstance.on('disconnected', () => {
        setStatus("⚠️ Signaling connection lost. Reconnecting might be needed.", true);
      });
      
      peerInstance.on('close', () => {
        setStatus("Peer connection closed. Reload page to restart.", true);
      });
      
      // timeout for safety
      setTimeout(() => {
        if (!peerInstance.id) reject(new Error("PeerJS initialization timeout"));
      }, 10000);
    });
  }

  // ---------- Global cleanup before new call or on hangup ----------
  function hangupCall() {
    if (!isCallActive && !currentCall) {
      setStatus("No active call to hang up.");
      return;
    }
    endCurrentCall();
  }

  // ---------- Copy Peer ID to clipboard ----------
  async function copyPeerId() {
    const id = myPeerIdSpan.innerText;
    if (!id || id === "Connecting...") {
      setStatus("Peer ID not yet available, please wait...", true);
      return;
    }
    try {
      await navigator.clipboard.writeText(id);
      setStatus(`Copied ID: ${id} to clipboard!`);
    } catch (err) {
      setStatus("Failed to copy ID manually", true);
    }
  }

  // ---------- Main async initialization ----------
  async function bootstrap() {
    // Step 1: get camera/mic access
    const mediaReady = await initLocalMedia();
    if (!mediaReady) {
      setStatus("Cannot start video chat without camera/mic. Please allow permissions and reload.", true);
      // still allow peer to show id but disable call button? but we can still initialize peer for ID sharing
    }
    
    // Step 2: initialize peer connection (signaling)
    try {
      peer = await initPeer();
      // after peer ready, enable call functionality fully
      callBtn.disabled = false;
      hangupBtn.disabled = false;
      if (!mediaReady) {
        setStatus("⚠️ Camera/mic missing, but you can still share Peer ID. Calls won't work.", true);
      } else {
        setStatus("✅ Ready! Share your Peer ID and enter remote ID to start video chat.");
      }
    } catch (err) {
      console.error("Peer init failed:", err);
      setStatus("Failed to establish signaling server connection. Check network and reload.", true);
      callBtn.disabled = true;
    }
  }

  // ---------- Attach event listeners to UI ----------
  function bindUIEvents() {
    copyIdBtn.addEventListener('click', copyPeerId);
    
    callBtn.addEventListener('click', () => {
      const remoteId = remoteIdInput.value.trim();
      if (!remoteId) {
        setStatus("Please enter a valid remote Peer ID.", true);
        return;
      }
      if (!localStream) {
        setStatus("Local media not available. Reload and allow camera/mic.", true);
        return;
      }
      if (!peer || !peer.id) {
        setStatus("Peer not initialized yet. Wait a moment.", true);
        return;
      }
      startCall(remoteId);
    });
    
    hangupBtn.addEventListener('click', () => {
      hangupCall();
    });
    
    toggleMicBtn.addEventListener('click', toggleMicrophone);
    toggleCamBtn.addEventListener('click', toggleCamera);
    
    // optional: clear remote video on page unload gracefully
    window.addEventListener('beforeunload', () => {
      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
      }
      if (currentCall) currentCall.close();
      if (peer) peer.destroy();
    });
  }

  // ----- start application -----
  bootstrap().then(() => {
    bindUIEvents();
  }).catch(err => {
    console.error("Boot error:", err);
    setStatus(`Initialization failed: ${err.message}`, true);
  });
</script>
</body>
</html>
